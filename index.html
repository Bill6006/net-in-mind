 DC; authentication may fail despite a correct password.","why":"Kerberos uses timestamps to help reject replayed authentication.","note":"Five minutes is the common default maximum clock skew; verify the domain policy. Clock synchronization is a dependency, not proof that credentials are valid.","visual":"flow","interaction":{"prompt":"Correct password + large clock skew: investigate…","options":["Time synchronization","Only subnet capacity"],"answer":0,"explain":"A clock mismatch can invalidate timestamp-based authentication."},"questions":[{"prompt":"Why does Kerberos care about time?","options":["Timestamp and replay protection","To choose DNS record type","To count subnet hosts"],"answer":0,"explain":"Participating clocks must be sufficiently synchronized.","hard":false},{"prompt":"What is the common default maximum Kerberos clock skew?","options":["Five minutes","Five days","Unlimited"],"answer":0,"explain":"Verify the actual domain policy rather than assuming.","hard":false},{"prompt":"DNS and the required ports work; authentication reports a time difference. Best next step?","options":["Compare device/DC clocks and time source","Expand the VNet","Disable DNS"],"answer":0,"explain":"Reachability does not fix a timestamp mismatch.","hard":true}],"sources":[{"title":"Microsoft Learn: Kerberos clock tolerance","url":"https://learn.microsoft.com/en-us/windows/security/threat-protection/security-policy-settings/maximum-tolerance-for-computer-clock-synchronization"},{"title":"Microsoft protocol specification: Kerberos prerequisites","url":"https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-kile/c427eaf8-72ae-4e4d-aeea-109263de7eee"}]},{"id":"hybrid-identity-reachability","title":"Identity needs reachable services","group":"identity","anchor":"Hybrid identity needs both sides of the bridge.","analogy":"The local identity desk and the cloud registration desk must each be reachable.","example":"A hybrid join task cannot reach enterpriseregistration.windows.net under the SYSTEM account.","why":"Hybrid devices need periodic DC line of sight and access to required Microsoft identity endpoints.","note":"Browser access as the user does not prove SYSTEM proxy access. TLS inspection of device.login.microsoftonline.com or enterpriseregistration.windows.net can break registration.","visual":"flow","interaction":{"prompt":"Browser sign-in works, automatic device registration fails. Test connectivity as…","options":["The machine/SYSTEM context","Only the browser user"],"answer":0,"explain":"Device registration runs in machine context."},"questions":[{"prompt":"Do hybrid joined devices still need periodic access to their DCs?","options":["Yes","No, cloud join removes every AD dependency"],"answer":0,"explain":"Password and device lifecycle operations retain AD dependencies.","hard":false},{"prompt":"What can interfere with device certificate authentication to registration endpoints?","options":["TLS break-and-inspect","An ASG display name","A shorter subnet name"],"answer":0,"explain":"Microsoft documents exclusions for the device login and registration endpoints.","hard":false},{"prompt":"User web requests pass an authenticated proxy; SYSTEM cannot authenticate to it. Likely result?","options":["Device registration can fail","The NSG becomes transitive","All public IPs become private"],"answer":0,"explain":"Test the required endpoint path from machine context.","hard":true}],"sources":[{"title":"Microsoft Learn: Configure hybrid join","url":"https://learn.microsoft.com/en-us/entra/identity/devices/how-to-hybrid-join"},{"title":"Microsoft Learn: Plan hybrid join","url":"https://learn.microsoft.com/entra/identity/devices/hybrid-join-plan"}]},{"id":"named-locations","title":"Entra named locations","group":"identity","anchor":"Cloud location sees the public exit.","analogy":"The cloud sees the building's exit address, not your desk number.","example":"Laptop 10.1.2.3 exits through 198.51.100.10; an IP-based named location uses the public egress range.","why":"IP-based named locations match public IPv4/IPv6 ranges in CIDR notation.","note":"Country-based locations also exist. A 'trusted' label does not independently grant access; Conditional Access policy decides the result. Proxy/VPN routing can change the observed IP.","visual":"location","interaction":{"prompt":"Which goes in an office's IP-based named location?","options":["Its verified public egress CIDR","Every laptop's 10.x private IP"],"answer":0,"explain":"Entra evaluates the public address presented by that traffic path."},"questions":[{"prompt":"IP-based named locations describe…","options":["Public CIDR ranges","Private subnet gateways only","Device serial numbers"],"answer":0,"explain":"The range matches the public source seen by the cloud.","hard":false},{"prompt":"Does marking a range trusted automatically bypass every CA policy?","options":["Yes","No"],"answer":1,"explain":"Policy assignments and grant controls still determine access.","hard":false},{"prompt":"The office changes internet providers and its egress IP changes. Location-based outcomes change. Check…","options":["The verified public egress and named-location range","Only the laptop's unchanged private IP","Whether the VNet has five reservations"],"answer":0,"explain":"The cloud-visible source can change while local addressing stays the same.","hard":true}],"sources":[{"title":"Microsoft Learn: Conditional Access network signals","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/concept-assignment-network"}]},{"id":"signin-logs","title":"Entra sign-in logs","group":"identity","anchor":"Read the event: who, IP, result, policy.","analogy":"Use the receipt from the failed attempt instead of guessing at the gate.","example":"Find the matching user, time and resource; inspect IP, location, failure reason and Conditional Access details.","why":"Logs show the evidence used for an authentication and policy decision.","note":"IP-to-country mapping is approximate; VPN/proxy egress may be far from the device. Entra and the resource provider can see different IPs, especially with split tunnels or IPv4/IPv6 differences.","visual":"location","interaction":{"prompt":"A sign-in country differs from the user's location. Treat it as…","options":["A clue to investigate with the IP and routing","Proof the user traveled there"],"answer":0,"explain":"Geolocation estimates and centralized egress can differ from physical location."},"questions":[{"prompt":"Where can you see which CA policy interrupted the matching sign-in?","options":["Its Conditional Access details","The subnet mask alone","The ASG name"],"answer":0,"explain":"Match the event, then inspect its policy result.","hard":false},{"prompt":"Does a sign-in IP prove a device's exact physical location?","options":["Yes","No"],"answer":1,"explain":"IP geolocation is best effort.","hard":false},{"prompt":"Entra sees an office IP but the resource sees a home IP. What could explain it?","options":["Different split-tunnel or IPv4/IPv6 paths","Every private IP is public","NSGs change passwords"],"answer":0,"explain":"Identity-provider and resource-provider requests can leave through different paths.","hard":true}],"sources":[{"title":"Microsoft Learn: Sign-in activity details","url":"https://learn.microsoft.com/en-us/entra/identity/monitoring-health/concept-sign-in-log-activity-details"},{"title":"Microsoft Learn: CAE sign-in troubleshooting","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/howto-continuous-access-evaluation-troubleshoot"},{"title":"Microsoft Learn: Conditional Access troubleshooting","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/troubleshoot-conditional-access"}]},{"id":"vpn-ca","title":"VPN routing and Conditional Access","group":"identity","anchor":"VPN changes the exit only for traffic it carries.","analogy":"A tunnel changes where a traveler emerges only if they enter it.","example":"A split tunnel sends file-server traffic to the office, but cloud sign-in traffic exits the home internet connection.","why":"The observed cloud source follows the actual route, which can change network-based policy outcomes.","note":"VPN connection status alone does not prove a trusted cloud location. Check public egress and sign-in evidence. Device-based and other CA requirements can still apply.","visual":"vpn","interaction":{"prompt":"VPN is connected, but login traffic bypasses it. Which exit may Entra see?","options":["The local internet exit","Always the VPN gateway"],"answer":0,"explain":"Follow the route taken by the identity traffic."},"questions":[{"prompt":"Does a connected VPN guarantee that cloud traffic uses its egress?","options":["Yes","No"],"answer":1,"explain":"Split-tunnel routing may bypass the VPN.","hard":false},{"prompt":"A cloud proxy can cause Entra to observe…","options":["The proxy's public egress IP","The laptop's MAC address","Only its private gateway"],"answer":0,"explain":"Without supported source-IP restoration, the proxy exit is observed.","hard":false},{"prompt":"VPN changes the observed IP to a trusted range, but CA still blocks access for device noncompliance. Why?","options":["Other policy requirements still apply","Named locations never work","A VPN removes all CA rules"],"answer":0,"explain":"A location match does not satisfy a device compliance requirement.","hard":true}],"sources":[{"title":"Microsoft Learn: Protect networks","url":"https://learn.microsoft.com/en-us/entra/fundamentals/zero-trust-protect-networks"},{"title":"Microsoft Learn: CAE IP mismatch troubleshooting","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/howto-continuous-access-evaluation-troubleshoot"},{"title":"Microsoft Learn: Conditional Access troubleshooting","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/troubleshoot-conditional-access"}]},{"id":"troubleshooting","title":"Network failure or identity denial?","group":"identity","anchor":"Reach the service; then read its decision.","analogy":"First find the gate and get there; then learn why the guard refuses entry.","example":"DNS failure points toward name resolution; an AADSTS53003 event points toward Conditional Access.","why":"Troubleshoot the failed stage: DNS → route/port → TLS → authentication/policy.","note":"This is a diagnostic sequence, not a guarantee. A timeout is not a wrong-password diagnosis, and a successful TCP test does not prove authentication will succeed.","visual":"flow","interaction":{"prompt":"The correct sign-in event says BlockedByConditionalAccess. Inspect…","options":["The applied CA policy and event details","Only whether ping works"],"answer":0,"explain":"The service received a request and recorded a policy denial."},"questions":[{"prompt":"The hostname returns NXDOMAIN. First failed stage?","options":["DNS name resolution","MFA proof","Password age"],"answer":0,"explain":"The name did not resolve; start with its DNS path and records.","hard":false},{"prompt":"Successful TCP 443 proves that…","options":["That port is reachable at that moment","The user's password is valid","Every CA policy permits access"],"answer":0,"explain":"Transport reachability does not validate identity.","hard":false},{"prompt":"A page loads and the matching sign-in log says device noncompliant. Best investigation?","options":["Device state and the CA policy requirements","Change the DNS A record blindly","Count broadcast addresses"],"answer":0,"explain":"The evidence identifies an identity/policy requirement after network access.","hard":true}],"sources":[{"title":"Microsoft Learn: Conditional Access troubleshooting","url":"https://learn.microsoft.com/en-us/entra/identity/conditional-access/troubleshoot-conditional-access"},{"title":"Microsoft Learn: Connection troubleshoot overview","url":"https://learn.microsoft.com/en-us/azure/network-watcher/connection-troubleshoot-overview"},{"title":"Microsoft Learn: Private endpoint DNS troubleshooting","url":"https://learn.microsoft.com/en-us/troubleshoot/azure/private-link/troubleshoot-private-endpoint-dns-resolution"}]},{"id":"hybrid-path","title":"Identity failure or broken path?","group":"traffic","anchor":"Name → route → door → TLS → identity.","analogy":"Before blaming the key, confirm the address, road, entrance, and secure conversation.","example":"A sync service cannot reach its cloud endpoint. Check the expected DNS answer, path/proxy, required destination port, then TLS/certificate behavior and the identity error.","why":"Authentication depends on network services. Failure to reach or securely connect to an endpoint can appear to users as a sign-in failure.","note":"This is a troubleshooting order, not proof of root cause. Test the actual app, endpoint, transport, and port. Ping success does not prove HTTPS works; ping failure may only mean ICMP is blocked.","visual":"flow","interaction":{"prompt":"DNS returns the expected IP. Have you proved sign-in will work?","options":["Yes","No, it proves only the lookup step","Only if the IP is private"],"answer":1,"explain":"You still need a working connection, TLS, and an allowed identity decision."},"questions":[{"prompt":"Which is the first question for a name-resolution failure?","options":["What DNS answer does this client actually get?","Which MFA method is prettier?","How many usable hosts does /28 have?"],"answer":0,"explain":"Validate the name-to-destination step before following the path.","hard":false},{"prompt":"A server responds to ping. What has this not proved?","options":["ICMP traffic can return","That TCP 443 and the app's TLS/authentication work","That some network path exists"],"answer":1,"explain":"ICMP echo and HTTPS test different protocols and service behavior.","hard":false},{"prompt":"A sync service reports connection errors but the same user's browser works. Best evidence to compare?","options":["Actual endpoint, resolver, proxy, service context, and TLS error","Only the user's password age","Only whether the computer has a private IP"],"answer":0,"explain":"The service can use a different proxy or execution context from the browser.","hard":true}],"sources":[{"title":"Microsoft — Entra Connect connectivity troubleshooting","url":"https://learn.microsoft.com/en-us/entra/identity/hybrid/connect/tshoot-connect-connectivity"},{"title":"Microsoft — Test-NetConnection","url":"https://learn.microsoft.com/en-us/powershell/module/nettcpip/test-netconnection"}]},{"id":"supernetting","title":"Optional: combine neighboring routes","group":"traffic","anchor":"Equal neighbors + correct boundary → one larger block.","analogy":"Two adjacent ruler blocks can become their shared parent block.","example":"10.4.0.0/24 + 10.4.1.0/24 = 10.4.0.0/23. Two 256-address blocks become one 512-address block.","why":"An exact summary shares one fewer prefix bit. The member blocks must be adjacent, equal-sized, and aligned to that larger block.","note":"10.4.1.0/24 and 10.4.2.0/24 are adjacent but are not an exact /23 pair. A wider summary would also include extra addresses; confirm routing and policy intent before widening.","visual":"route","interaction":{"prompt":"Exact summary of 10.4.2.0/24 and 10.4.3.0/24?","options":["10.4.2.0/23","10.4.2.0/25","10.4.3.0/23"],"answer":0,"explain":"/23 pairs start on an even third octet; 2 and 3 share the aligned block."},"questions":[{"prompt":"Combining two exact /24 siblings changes the prefix to what?","options":["/25","/23","/24"],"answer":1,"explain":"Double the size: slash down one.","hard":false},{"prompt":"Can any two adjacent /24s become one exact /23?","options":["Yes","No, they must align to the same /23 boundary","Only if both have DHCP"],"answer":1,"explain":"Adjacency alone is insufficient; the shared parent block must fit exactly.","hard":false},{"prompt":"You summarize 10.4.1.0/24 and 10.4.2.0/24 as 10.4.0.0/22. What must you notice?","options":["It also includes 10.4.0.0/24 and 10.4.3.0/24","It includes only the original two","It removes half their addresses"],"answer":0,"explain":"/22 covers third octets 0–3. A summary can silently broaden the matched range.","hard":true}],"sources":[{"title":"RFC 1519 — CIDR aggregation","url":"https://www.rfc-editor.org/info/rfc1519/"}]},{"id":"ipv6","title":"Optional: IPv6 is a separate ruler","group":"foundations","anchor":"128 bits. Hex groups. No broadcast.","analogy":"Use a much longer address ruler, with its own habits. Do not borrow IPv4's subtract-two shortcut.","example":"2001:db8:1::25 is a documentation IPv6 address. AAAA is its DNS record type. A /64 is common for ordinary IPv6 LAN subnets.","why":"IPv6 uses 128-bit addresses. Colon-separated hexadecimal groups represent the bits; :: can compress one consecutive run of zero groups.","note":"Keep this separate until IPv4 feels comfortable. IPv6 has no broadcast address. Do not apply IPv4 network/broadcast host-count rules. Dual-stack systems may choose IPv6, so IPv4-only policy checks can miss a path.","visual":"ip","interaction":{"prompt":"Which IPv4 shortcut should you avoid carrying into IPv6?","options":["Prefix notation describes a block","Subtract two for network and broadcast","DNS can provide an address"],"answer":1,"explain":"IPv6 has no broadcast address; its address-use rules differ."},"questions":[{"prompt":"How many bits in an IPv6 address?","options":["32","64","128"],"answer":2,"explain":"IPv6 addresses are 128 bits; /64 is a common prefix, not total address length.","hard":false},{"prompt":"Which DNS record provides IPv6 addresses?","options":["AAAA","A","CNAME only"],"answer":0,"explain":"A is IPv4; AAAA is IPv6.","hard":false},{"prompt":"An app succeeds over IPv6 while an IPv4-only firewall rule was changed. What should you check?","options":["The actual address family and IPv6 policy/path","Only the IPv4 last octet","Whether IPv6 has a broadcast address"],"answer":0,"explain":"Dual-stack paths require checking the family the connection actually used.","hard":true}],"sources":[{"title":"RFC 8200 — IPv6","url":"https://www.rfc-editor.org/info/rfc8200/"},{"title":"RFC 4291 — IPv6 addressing","url":"https://www.rfc-editor.org/rfc/rfc4291.html"},{"title":"RFC 3596 — AAAA records","url":"https://www.rfc-editor.org/info/rfc3596/"}]}];

function validRecord(r){

 const out={};
 for(const key of ['attempts','correct','mental','lapses','streak','interval','helped']){const v=r[key]??0;if(!Number.isFinite(v)||v<0||v>1000000)throw Error('Invalid progress values.');out[key]=Math.floor(v);}

 for(const key of ['due','last']){const v=r[key]??0;if(!Number.isFinite(v)||v<0||v>4102444800000)throw Error('Invalid review date.');out[key]=v;}

}
function validateState(raw){

function record(id,correct,help){
 const now=Date.now(),r={...rec(id),seen:true};r.attempts++;r.last=now;
 if(correct){r.correct++;r.streak++;if(help){r.helped++;r.lastResult='help';r.interval=0;r.due=now+10*60000;}else{r.mental++;r.lastResult='correct';const today=new Date(),d=[today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-'),newDay=!r.dates.includes(d);if(newDay)r.dates=[...r.dates,d].slice(-30);if(newDay||r.interval===0){r.interval=Math.min(5,r.interval+1);r.due=now+[1,3,7,14,30][r.interval-1]*DAY;}}}
 else{r.lapses++;r.streak=0;r.interval=0;r.lastResult='miss';r.due=now+10*60000;}
 state.concepts[id]=r;save();
}

function subnet(ip,p){const n=ipNum(ip),size=2**(32-p),start=Math.floor(n/size)*size,end=start+size-1;return {n,size,start,end,network:numIP(start),broadcast:p<31?numIP(end):null,first:numIP(p<31?start+1:start),last:numIP(p<31?end-1:end),usable:p<31?Math.max(0,size-2):size};}
function ipNum(ip){if(typeof ip!=='string'||!/^\d{1,3}(\.\d{1,3}){3}$/.test(ip.trim()))throw Error('Enter four numbers from 0 to 255, separated by dots.');const a=ip.trim().split('.').map(Number);if(a.some(v=>v>255))throw Error('Each IPv4 number must be between 0 and 255.');return a.reduce((n,v)=>n*256+v,0);}
function numIP(n){return [Math.floor(n/16777216)%256,Math.floor(n/65536)%256,Math.floor(n/256)%256,n%256].join('.');}
function mentalHint(ip,p){const s=subnet(ip,p),oct=p>=24?3:2,block=p>=24?s.size:s.size/256,v=Number(ip.split('.')[oct]),low=Math.floor(v/block)*block;return p===32?'A /32 is exactly one address. No subtraction needed.':p===31?'A /31 point-to-point link has two endpoint addresses. Do not subtract network and broadcast.':p===23?`/23 is two /24s: pair third octets 0–1, 2–3, 4–5… Here ${v} pairs with ${low}–${low+1}.`:`Start at /24 = 256. Each slash step up halves. /${p} = ${s.size}; find multiples of ${block} around .${v}.`;}

  const words=root.textContent.split(/\s+/).filter(Boolean);if(words.length<2)return false;

function resized(){syncViewport();cancelAnimationFrame(fitPending);fitPending=requestAnimationFrame(fitScreen);}
window.addEventListener('resize',resized);window.visualViewport?.addEventListener('resize',resized);
syncViewport();prefix=24;renderLearn();if(!storageOK)toast('This browser cannot save progress. Use Settings → Export to keep it.');

</script>
